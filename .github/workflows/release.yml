name: CI / Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Joomla compatibility tests
    runs-on: ubuntu-latest
    services:
      mysql:
        # MariaDB: mysql_native_password by default.
        # PHP 7.2 mysqli can't auth to MySQL 8 caching_sha2_password (HY000/2054).
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: joomladb
        ports:
          - 3306:3306
        options: >
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - joomla: "4.4.5"
            php: "7.2"
            package_url: "https://downloads.joomla.org/cms/joomla4/4-4-5/Joomla_4-4-5-Stable-Full_Package.zip?format=zip"
          - joomla: "5.1.0"
            php: "8.1"
            package_url: "https://downloads.joomla.org/cms/joomla5/5-1-0/Joomla_5-1-0-Stable-Full_Package.zip?format=zip"
          - joomla: "6.1.2"
            php: "8.3"
            package_url: "https://downloads.joomla.org/cms/joomla6/6-1-2/Joomla_6-1-2-Stable-Full_Package.zip?format=zip"

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: joomladb
      DB_PORT: 3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, json, zip, mysqli

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            php -r 'new mysqli(getenv("DB_HOST"), getenv("DB_USER"), getenv("DB_PASSWORD"), getenv("DB_NAME"), getenv("DB_PORT")); if (mysqli_connect_errno()) exit(1);' && exit 0
            sleep 3
          done
          echo "MySQL did not become available" && exit 1

      - name: Download Joomla ${{ matrix.joomla }}
        run: |
          echo "Downloading Joomla ${{ matrix.joomla }}"
          curl -L "${{ matrix.package_url }}" -o joomla.zip
          unzip -q joomla.zip -d joomla

      - name: Create Joomla temporary directories
        run: |
          mkdir -p joomla/tmp joomla/logs joomla/administrator/logs
          chmod -R 777 joomla/tmp joomla/logs joomla/administrator/logs

      - name: Install Joomla via CLI
        run: |
          cd joomla
          ARGS=(
            --site-name="Easy Quick Contact Test"
            --admin-user="Easy Quick Contact Administrator"
            --admin-username="admin"
            --admin-password="Admin123!Pass"
            --admin-email="admin@example.com"
            --db-type=mysqli
            --db-host="$DB_HOST"
            --db-user="$DB_USER"
            --db-pass="$DB_PASSWORD"
            --db-name="$DB_NAME"
            --db-prefix="jos_"
            --db-encryption=0
            --no-interaction
          )
          # --public-folder exists only on Joomla 5+
          case "${{ matrix.joomla }}" in
            5.*|6.*) ARGS+=(--public-folder=) ;;
          esac
          php installation/joomla.php install "${ARGS[@]}"

      - name: Validate manifest extension type and folder name
        run: |
          if [ ! -f "mod_easyquickcontact.xml" ]; then
            echo "mod_easyquickcontact.xml not found in repo root" >&2
            exit 1
          fi
          if ! grep -Ei '<extension[^>]*type="module"' mod_easyquickcontact.xml >/dev/null; then
            echo "mod_easyquickcontact.xml does not declare a module (type=\"module\")" >&2
            exit 1
          fi
          if ! grep -Ei 'mod_easyquickcontact' mod_easyquickcontact.xml >/dev/null; then
            echo "Warning: mod_easyquickcontact.xml does not reference mod_easyquickcontact; ensure manifest and folder match." >&2
          fi

      - name: Create module package archive
        run: |
          set -euo pipefail
          PACKAGE_DIR=package
          rm -rf "$PACKAGE_DIR" module-package.zip
          mkdir -p "$PACKAGE_DIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='joomla' \
            --exclude='joomla.zip' \
            --exclude='package' \
            --exclude='module-package.zip' \
            --exclude='_ci_debug' \
            --exclude='README.md' \
            ./ "$PACKAGE_DIR/"
          (cd "$PACKAGE_DIR" && zip -r ../module-package.zip .)
          echo "module-package.zip created:"
          unzip -l module-package.zip

      - name: Install module with Joomla CLI (show errors)
        run: |
          set -euo pipefail
          # Joomla InstallerHelper::unpack() extracts next to the package using dirname($path).
          # Relative paths like ../module-package.zip yield an empty extract dir → type=false.
          PACKAGE_PATH="${GITHUB_WORKSPACE}/module-package.zip"
          cd joomla
          if ! php cli/joomla.php extension:install --path="$PACKAGE_PATH" 2>&1 | tee /tmp/joomla-install-output.txt; then
            echo "Joomla extension installer reported an error." >&2
            echo "----- installer output -----" >&2
            cat /tmp/joomla-install-output.txt >&2 || true
            echo "----- package path -----" >&2
            ls -la "$PACKAGE_PATH" >&2 || true
            echo "----- zip listing -----" >&2
            unzip -l "$PACKAGE_PATH" >&2 || true
            echo "----- joomla logs -----" >&2
            ls -la administrator/logs >&2 || true
            for f in administrator/logs/*; do
              [ -f "$f" ] && { echo "=== $f ===" >&2; tail -n 80 "$f" >&2; }
            done || true
            echo "----- configuration tmp/log paths -----" >&2
            php -r 'include "configuration.php"; $c=new JConfig; echo "tmp_path={$c->tmp_path}\nlog_path={$c->log_path}\n";' >&2 || true
            echo "----- end -----" >&2
            exit 1
          fi

      - name: Verify module installation
        run: |
          cd joomla
          php cli/joomla.php extension:list --type=module | tee /tmp/joomla-module-list.txt
          grep -i -n 'mod_easyquickcontact\|easy quick contact\|MOD_EASYQUICKCONTACT' /tmp/joomla-module-list.txt || {
            echo "Module mod_easyquickcontact not found in Joomla module list"
            exit 1
          }

      - name: Validate PHP syntax in module files
        run: |
          find joomla/modules/mod_easyquickcontact -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate module manifest XML
        run: php -r 'new SimpleXMLElement(file_get_contents("mod_easyquickcontact.xml")); echo "mod_easyquickcontact.xml is valid XML\n";'

      - name: Validate update.xml
        run: php -r 'new SimpleXMLElement(file_get_contents("update.xml")); echo "update.xml is valid XML\n";'

      - name: Report test environment
        run: |
          echo "Joomla version: ${{ matrix.joomla }}"
          php -v

  release:
    name: Build and publish release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep -oPm1 "(?<=<version>)[^<]+" mod_easyquickcontact.xml)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP package
        id: package
        run: |
          PACKAGE_NAME="easy-quick-contact-joomla-${{ steps.version.outputs.VERSION }}.zip"
          zip -r "$PACKAGE_NAME" . \
            -x "$PACKAGE_NAME" \
            -x ".git/*" \
            -x ".github/*" \
            -x "_ci_debug/*" \
            -x "package/*" \
            -x "module-package.zip"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload package
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.VERSION }}
          release_name: "Easy Quick Contact Joomla ${{ steps.version.outputs.VERSION }}"
          body: "Automatic release build for version ${{ steps.version.outputs.VERSION }}"
          files: ${{ steps.package.outputs.PACKAGE_NAME }}
          draft: false
          prerelease: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
