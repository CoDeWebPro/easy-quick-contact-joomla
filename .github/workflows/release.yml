name: CI / Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Joomla compatibility tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: joomladb
        ports:
          - 3306:3306
        options: >
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      matrix:
        include:
          - joomla: "4.4.5"
            php: "7.2.5"
            package_url: "https://downloads.joomla.org/cms/joomla4/4-4-5/Joomla_4-4-5-Stable-Full_Package.zip?format=zip"
          - joomla: "5.1.0"
            php: "8.1.0"
            package_url: "https://downloads.joomla.org/cms/joomla5/5-1-0/Joomla_5-1-0-Stable-Full_Package.zip?format=zip"
          - joomla: "6.1.2"
            php: "8.3.0"
            package_url: "https://downloads.joomla.org/cms/joomla6/6-1-2/Joomla_6-1-2-Stable-Full_Package.zip?format=zip"

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: joomladb
      DB_PORT: 3306

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl, json, zip, mysqli

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            php -r 'new mysqli(getenv("DB_HOST"), getenv("DB_USER"), getenv("DB_PASSWORD"), getenv("DB_NAME"), getenv("DB_PORT")); if (mysqli_connect_errno()) exit(1);' && exit 0
            sleep 3
          done
          echo "MySQL did not become available" && exit 1

      - name: Download Joomla ${{ matrix.joomla }}
        run: |
          echo "Downloading Joomla ${{ matrix.joomla }}"
          curl -L "${{ matrix.package_url }}" -o joomla.zip
          unzip -q joomla.zip -d joomla

      - name: Create Joomla temporary directories
        run: |
          mkdir -p joomla/tmp joomla/logs joomla/administrator/logs
          chmod -R 775 joomla/tmp joomla/logs joomla/administrator/logs

      - name: Install Joomla via CLI
        run: |
          cd joomla
          php cli/joomla.php site:install \
            --db-driver=mysqli \
            --db-host="$DB_HOST" \
            --db-user="$DB_USER" \
            --db-pass="$DB_PASSWORD" \
            --db-name="$DB_NAME" \
            --db-prefix="jos_" \
            --db-port="$DB_PORT" \
            --site-name="Easy Quick Contact Test" \
            --admin-user="admin" \
            --admin-password="Admin123!" \
            --admin-email="admin@example.com" \
            --site-locale="en-GB" \
            --site-offline=0

      - name: Create module package archive
        run: |
          zip -r module-package.zip . -x "module-package.zip" ".git/*" ".github/*" "node_modules/*" "vendor/*"

      - name: Install module with Joomla CLI
        run: |
          cd joomla
          php cli/joomla.php extension:install ../module-package.zip

      - name: Verify module installation
        run: |
          cd joomla
          php cli/joomla.php extension:list --type=module | tee /tmp/joomla-module-list.txt
          grep -i -n 'mod_easyquickcontact\|easy quick contact\|MOD_EASYQUICKCONTACT' /tmp/joomla-module-list.txt || {
            echo "Module mod_easyquickcontact not found in Joomla module list"
            exit 1
          }

      - name: Validate PHP syntax in module files
        run: |
          find joomla/modules/mod_easyquickcontact -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate module manifest XML
        run: php -r 'new SimpleXMLElement(file_get_contents("mod_easyquickcontact.xml")); echo "mod_easyquickcontact.xml is valid XML\n";'

      - name: Validate update.xml
        run: php -r 'new SimpleXMLElement(file_get_contents("update.xml")); echo "update.xml is valid XML\n";'

      - name: Report test environment
        run: |
          echo "Joomla version: ${{ matrix.joomla }}"
          php -v

  release:
    name: Build and publish release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep -oPm1 "(?<=<version>)[^<]+" mod_easyquickcontact.xml)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP package
        id: package
        run: |
          PACKAGE_NAME="easy-quick-contact-joomla-${{ steps.version.outputs.VERSION }}.zip"
          zip -r "$PACKAGE_NAME" . -x "$PACKAGE_NAME" ".git/*" ".github/*"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload package
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.VERSION }}
          release_name: "Easy Quick Contact Joomla ${{ steps.version.outputs.VERSION }}"
          body: "Automatic release build for version ${{ steps.version.outputs.VERSION }}"
          files: ${{ steps.package.outputs.PACKAGE_NAME }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}